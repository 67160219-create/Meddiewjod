{% extends "base.html" %}{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<form method="post" class="max-w-sm mx-auto bg-white border rounded-lg p-6 space-y-3">
  <h1 class="text-xl font-bold">เข้าสู่ระบบ</h1>
  <input type="email" name="email" required placeholder="อีเมล" class="border rounded w-full px-3 py-2">
  <input type="password" name="password" required placeholder="รหัสผ่าน" class="border rounded w-full px-3 py-2">
  <button class="bg-teal-700 text-white rounded px-5 py-2 w-full">เข้าสู่ระบบ</button>
  <p class="text-sm text-center">ยังไม่มีบัญชี? <a href="{{ url_for('register') }}" class="underline text-teal-800">สมัครสมาชิก</a></p>
</form>
{% endblock %}
